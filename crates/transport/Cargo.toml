[package]
name = "remotevnc-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Explicit native fixture support; omitted from normal release builds.
native-test = []

[dependencies]
remotevnc-protocol = { path = "../protocol" }
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.24", features = ["v1_24"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.24", features = ["v1_24"] }
crossbeam-channel = "0.5"
thiserror.workspace = true
url = "2"

[dev-dependencies]
uuid.workspace = true
