name: native checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 clippy -p remotevnc-protocol -p remotevnc-backend -p remotevnc-device --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test -p remotevnc-protocol -p remotevnc-backend -p remotevnc-device --locked
      - run: python3 scripts/test-backend-maintenance.py
      - run: sudo python3 scripts/test-ubuntu-installer.py
  ubuntu-native:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - run: apt-get update && apt-get install -y ca-certificates curl git build-essential pkg-config libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice libx11-dev libxtst-dev libxi-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libwayland-dev xvfb xauth x11-utils nginx-core python3 python3-gi gir1.2-gtk-3.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh && sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.95.0 --component rustfmt --component clippy
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: scripts/check.sh
      - run: python3 scripts/test-backend-ingress.py
      - run: scripts/test-x11.sh
      - run: scripts/test-e2e.sh
      - run: scripts/build-linux.sh
  macos-native:
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: scripts/setup-macos-media.sh
      - run: source .deps/media/env.sh && scripts/check.sh
      - run: source .deps/media/env.sh && packaging/macos/build-app.sh
