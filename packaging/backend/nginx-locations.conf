# Merge these locations into the EXISTING HTTPS server only after routing review.
# Preserve /v1, /auth/google and the exact registered /login/callback; no path prefix.
location ~ ^/(v1(?:/|$)|auth/google(?:/|$)|login/callback$) {
    limit_req zone=remotevnc_global burst=30 nodelay;
    limit_req_status 429;
    limit_conn remotevnc_connections 64;
    client_max_body_size 16k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $remotevnc_connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:18080;
    access_log /var/log/nginx/remotevnc-access.log remotevnc_private;
    # nginx error messages can contain original callback query. Suppress at THIS location.
    error_log /dev/null crit;
}
