# Add ONLY in existing http{} after domain/path ownership review; no server/listen/DNS changes.
map $http_upgrade $remotevnc_connection_upgrade { default upgrade; '' close; }
# Constant key bounds aggregate writes even behind Cloudflare or rotating client IPs.
map $host $remotevnc_bucket { default remotevnc; }
limit_req_zone $remotevnc_bucket zone=remotevnc_global:1m rate=2r/s;
limit_conn_zone $remotevnc_bucket zone=remotevnc_connections:1m;
# No query strings, Authorization, cookies, referer, bodies or upstream error details.
log_format remotevnc_private '$time_iso8601 $request_method $uri $status';
