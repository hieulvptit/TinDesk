[package]
name = "remotevnc-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
remotevnc-protocol = { path = "../../crates/protocol" }
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ed25519-dalek.workspace = true
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"

[dev-dependencies]
remotevnc-device = { path = "../../crates/device" }
tempfile = "3"
jsonwebtoken = { version = "9", default-features = false }
rsa = { version = "0.9", features = ["pem"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
