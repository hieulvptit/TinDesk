[package]
name = "remotevnc-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
remotevnc-device = { path = "../../crates/device" }
remotevnc-protocol = { path = "../../crates/protocol" }
remotevnc-transport = { path = "../../crates/transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
libc = "0.2"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
uuid.workspace = true
tempfile = "3"
remotevnc-seat-helper = { path = "../seat-helper" }
remotevnc-backend = { path = "../backend" }
axum = { version = "0.8", features = ["form", "ws"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = { version = "9", default-features = false }
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
url = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }
x11rb = { version = "0.13", features = ["xtest", "xinput"] }

[[test]]
name = "seat_service"
path = "tests/fixtures/seat_service.rs"
harness = false

[[test]]
name = "e2e_fixture"
path = "../../tests/e2e/fixture.rs"
harness = false

[[test]]
name = "e2e_session"
path = "../../tests/e2e/session.rs"
