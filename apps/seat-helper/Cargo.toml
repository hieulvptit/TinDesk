[package]
name = "binachicken-seat-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
binachicken-protocol = { path = "../../crates/protocol" }
x11rb = { version = "0.13", features = ["xtest", "xkb", "xinput", "randr"] }
libc = "0.2"
signal-hook = "0.3"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }

[dev-dependencies]
binachicken-transport = { path = "../../crates/transport" }
