[package]
name = "binachicken-mac-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
binachicken-protocol = { path = "../../crates/protocol" }
serde_json.workspace = true

# The host helper only exists on macOS; other platforms build an empty stub so
# `cargo check --workspace` keeps working.
[target.'cfg(target_os = "macos")'.dependencies]
binachicken-seat-helper = { path = "../seat-helper" }
core-foundation = "0.10"
core-graphics = "0.25"
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }
libc = "0.2"
signal-hook = "0.3"
