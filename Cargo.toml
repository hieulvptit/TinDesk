[workspace]
members = ["crates/protocol", "apps/seat-helper", "crates/transport", "apps/backend", "crates/device"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
ed25519-dalek = "2"
thiserror = "2"
